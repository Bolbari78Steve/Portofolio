<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IgoTech Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero { background: #2c3e50; color: white; padding: 4rem 0; }
        .project-card { margin-bottom: 2rem; }
        footer { background: #343a40; color: white; padding: 2rem 0; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">IgoTech</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link" href="#services">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="#projects">Projets</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="hero text-center">
        <div class="container">
            <h1 class="display-4">Votre partenaire digital</h1>
            <p class="lead">Des solutions sur mesure pour votre présence en ligne</p>
        </div>
    </section>

    <section id="projects" class="container my-5">
        <h2 class="text-center mb-4">Nos Réalisations</h2>
        <div class="row" id="projects-container">
            <!-- Projets chargés via JS -->
        </div>
    </section>

    <footer class="text-center">
        <div class="container">
            <p>&copy; 2025 IgoTech. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Données des projets
        const projects = [
            { 
                title: "Site E-commerce", 
                description: "Plateforme pour boutique de mode",
                category: "Web" 
            },
            { 
                title: "Campagne Instagram", 
                description: "Stratégie réseaux sociaux",
                category: "Social" 
            }
        ];

        // Affichage des projets
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('projects-container');
            
            projects.forEach(project => {
                const col = document.createElement('div');
                col.className = 'col-md-4';
                col.innerHTML = `
                    <div class="card project-card">
                        <div class="card-body">
                            <h5>${project.title}</h5>
                            <p>${project.description}</p>
                            <span class="badge bg-primary">${project.category}</span>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });
        });
    </script>
</body>
</html>
